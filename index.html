<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🌙 Moon Vault</title>
<meta name="theme-color" content="#0a0e1a">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;font-family:'Inter',sans-serif;background:#0a0e1a;color:#e2e8f0;overflow-x:hidden}
#bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.18;animation:drift 16s ease-in-out infinite alternate}
.blob-1{width:500px;height:500px;background:radial-gradient(circle,#3b82f6,transparent 70%);top:-200px;left:-140px}
.blob-2{width:550px;height:550px;background:radial-gradient(circle,#6366f1,transparent 70%);bottom:-220px;right:-160px;animation-delay:-8s}
.blob-3{width:350px;height:350px;background:radial-gradient(circle,#06b6d4,transparent 70%);top:30%;left:55%;animation-delay:-12s}
@keyframes drift{0%{transform:translate(0,0)scale(1)}100%{transform:translate(40px,30px)scale(1.08)}}
.stars{position:absolute;inset:0}
.star{position:absolute;width:2px;height:2px;background:#a5b4fc;border-radius:50%;animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:.8}}
.moon{position:absolute;top:5%;right:8%;width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#fef9c3,#e0e7ff);box-shadow:0 0 60px rgba(254,249,195,.3),0 0 120px rgba(254,249,195,.15);opacity:.6}
.moon::before{content:'';position:absolute;top:15px;left:20px;width:18px;height:18px;border-radius:50%;background:rgba(161,161,170,.2)}
.moon::after{content:'';position:absolute;top:40px;left:45px;width:12px;height:12px;border-radius:50%;background:rgba(161,161,170,.15)}
.shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.hero{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3rem 2rem 2rem;text-align:center}
.hero-icon{font-size:3rem;margin-bottom:.5rem;filter:drop-shadow(0 0 20px rgba(254,249,195,.2))}
.hero-title{font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,#fef9c3,#e0e7ff,#a5b4fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.02em}
.hero-tagline{font-size:.75rem;font-weight:600;color:#64748b;margin-top:.3rem;letter-spacing:.15em;text-transform:uppercase}
.hero-sub{font-size:.8rem;color:#818cf8;margin-top:.15rem;letter-spacing:.08em}
.hero-desc{font-size:.85rem;color:#64748b;margin-top:.6rem;max-width:400px;line-height:1.5}
.highlight{font-weight:700;background:linear-gradient(135deg,#fef9c3,#e0e7ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
/* Vault door */
.vault-door{position:relative;margin:.8rem auto 1.2rem;width:100%;max-width:440px}
.vault-door-inner{display:flex;align-items:center;gap:.35rem;background:rgba(15,23,42,.95);border:1px solid rgba(99,102,241,.15);border-radius:14px;padding:.35rem .35rem .35rem 1rem}
.vault-icon{font-size:1.1rem;opacity:.5}
.vault-input{flex:1;padding:.65rem .6rem;background:transparent;border:none;color:#e2e8f0;font-size:.88rem;font-family:inherit;outline:none}
.vault-input::placeholder{color:#475569}
.vault-btn{padding:.65rem 1.5rem;border-radius:10px;border:none;background:linear-gradient(135deg,#6366f1,#3b82f6);color:#fff;font:700 .82rem 'Inter',sans-serif;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.vault-btn:hover{transform:scale(1.04);box-shadow:0 6px 20px rgba(99,102,241,.4)}
/* Tabs */
.tabs{display:flex;gap:.35rem;justify-content:center;margin-bottom:1.2rem}
.tab{padding:.45rem 1.3rem;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid rgba(99,102,241,.12);background:transparent;color:#64748b;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:.35rem}
.tab.active{background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(59,130,246,.08));border-color:rgba(99,102,241,.25);color:#a5b4fc;box-shadow:0 0 20px rgba(99,102,241,.1)}
/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:1.3rem;padding:0 2rem 3rem;max-width:1100px;margin:0 auto;width:100%}
.card{position:relative;border-radius:16px;overflow:hidden;cursor:pointer;transition:all .3s ease;background:rgba(15,23,42,.7);border:1px solid rgba(99,102,241,.1)}
.card:hover{transform:translateY(-8px)scale(1.02);box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 1px rgba(99,102,241,.15),0 0 30px rgba(99,102,241,.08)}
.card-poster{aspect-ratio:2/3;position:relative;overflow:hidden;background:rgba(15,23,42,.5)}
.card-poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.card:hover .card-poster img{transform:scale(1.08)}
.card-badge{position:absolute;top:8px;right:8px;padding:3px 9px;border-radius:99px;font-size:.6rem;font-weight:800;backdrop-filter:blur(8px);text-transform:uppercase;letter-spacing:.04em}
.bf{background:rgba(99,102,241,.85);color:#fff}.af{background:rgba(59,130,246,.85);color:#fff}
.card-quality{position:absolute;bottom:48px;right:8px;padding:2px 8px;border-radius:99px;font-size:.58rem;font-weight:800;background:rgba(0,0,0,.75);color:#94a3b8;backdrop-filter:blur(4px)}
.card-rating{position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:99px;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);font-size:.68rem;font-weight:700;display:flex;align-items:center;gap:.2rem}
.card-rating .star{color:#fbbf24;font-size:.7rem}
.card-info{padding:.5rem .5rem .65rem}
.card-title{font-size:.74rem;font-weight:600;color:#e2e8f0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.card-meta{font-size:.6rem;color:#475569;margin-top:.15rem;display:flex;gap:.4rem;align-items:center}
.card-meta .src{color:#475569}
.card-meta .yr{color:#6366f1;font-weight:600}
/* Status */
.loading{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:3rem 2rem;color:#475569;text-align:center}
.loading .spinner{width:36px;height:36px;border:3px solid rgba(99,102,241,.1);border-top-color:#6366f1;border-radius:50%;animation:spin .7s linear infinite}
.loading .vault-text{font-size:.8rem;color:#6366f1;font-weight:600;letter-spacing:.06em}
.empty{display:none;flex-direction:column;align-items:center;gap:.8rem;padding:3rem 2rem;color:#475569;text-align:center}
.empty .e-icon{font-size:2.5rem;opacity:.3}
.empty .e-text{font-size:.8rem;color:#64748b}
/* Skeleton */
.skel{position:relative;border-radius:16px;overflow:hidden;background:rgba(15,23,42,.5);border:1px solid rgba(99,102,241,.08)}
.skel-poster{aspect-ratio:2/3;background:linear-gradient(110deg,rgba(99,102,241,.04)30%,rgba(59,130,246,.06)50%,rgba(99,102,241,.04)70%);background-size:200% 100%;animation:shimmer 1.6s ease infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
/* Modal */
.modal{display:none;position:fixed;inset:0;z-index:500;background:rgba(5,8,16,.94);backdrop-filter:blur(16px);align-items:center;justify-content:center;padding:1.5rem}
.modal.open{display:flex}
.mc{background:rgba(15,23,42,.98);border:1px solid rgba(99,102,241,.15);border-radius:18px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;padding:1.8rem}
.m-title{font-size:1.2rem;font-weight:800;margin-bottom:.35rem;color:#f1f5f9}
.m-meta{font-size:.72rem;color:#64748b;margin-bottom:.5rem;display:flex;gap:.5rem;flex-wrap:wrap}
.m-overview{font-size:.78rem;line-height:1.6;color:#94a3b8;margin-bottom:.8rem}
.m-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:1rem}
.m-tag{padding:2px 9px;border-radius:99px;font-size:.62rem;font-weight:700;background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.2);color:#a5b4fc}
.m-section-title{font-size:.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.08em;margin-bottom:.5rem}
.m-dls{list-style:none}
.m-dl{display:flex;align-items:center;gap:.6rem;padding:.65rem .9rem;background:rgba(99,102,241,.02);border:1px solid rgba(99,102,241,.08);border-radius:10px;margin-bottom:.35rem;cursor:pointer;transition:all .2s}
.m-dl:hover{background:rgba(99,102,241,.06);border-color:rgba(99,102,241,.18);transform:translateX(3px)}
.m-dl-name{flex:1;font-size:.75rem;font-weight:500;color:#e2e8f0}
.m-dl-quality{font-size:.62rem;color:#475569;font-weight:700}
.m-close{display:block;width:100%;padding:.65rem;margin-top:.8rem;background:rgba(99,102,241,.04);border:1px solid rgba(99,102,241,.1);color:#64748b;font-weight:600;cursor:pointer;border-radius:10px;font-size:.78rem;text-align:center}
/* Toast */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%)translateY(20px);background:rgba(15,23,42,.97);border:1px solid rgba(99,102,241,.25);border-radius:10px;padding:.55rem 1.1rem;font-size:.78rem;color:#a5b4fc;z-index:1000;transition:all .3s cubic-bezier(.34,1.56,.64,1);opacity:0;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)translateY(0)}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(99,102,241,.2);border-radius:99px}
</style>
</head>
<body>
<div id="bg">
  <div class="blob blob-1"></div><div class="blob blob-2"></div><div class="blob blob-3"></div>
  <div class="moon"></div>
  <div class="stars" id="stars"></div>
</div>
<div class="shell">
  <div class="hero">
    <div class="hero-icon">🌙</div>
    <div class="hero-title">Moon Vault</div>
    <div class="hero-tagline">✦ QUALITY • FAST • RELIABLE ✦</div>
    <div class="hero-sub">FIND • STREAM • DOWNLOAD</div>
    <div class="hero-desc">
      <span class="highlight">Download anything</span> in seconds.
      Movies, Anime & Series — all in one place.
    </div>
  </div>

  <div class="vault-door">
    <div class="vault-door-inner">
      <span class="vault-icon">🔍</span>
      <input class="vault-input" id="q" placeholder="Search movies, anime, series..." onkeydown="if(event.key==='Enter')s()" autofocus>
      <button class="vault-btn" onclick="s()">
        <span>🔓</span> Search
      </button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-movie" onclick="setType('movie',this)">🎬 Movies</button>
    <button class="tab" id="tab-anime" onclick="setType('anime',this)">🎌 Anime</button>
  </div>

  <div class="loading" id="loadEl" style="display:none">
    <div class="spinner"></div>
    <span class="vault-text">✦ Searching the vault... ✦</span>
  </div>

  <div class="empty" id="noRes">
    <div class="e-icon">🌙</div>
    <div class="e-text">Nothing found — try another search</div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mc">
    <div class="m-title" id="mT"></div>
    <div class="m-meta" id="mMeta"></div>
    <div class="m-overview" id="mOverview"></div>
    <div class="m-tags" id="mTags"></div>
    <div class="m-section-title">📥 DOWNLOAD LINKS</div>
    <ul class="m-dls" id="mLs"></ul>
    <button class="m-close" onclick="closeModal()">✕ Close</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
let curType = 'movie';

function e(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function setType(t, el) {
  curType = t;
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('grid').innerHTML = '';
  document.getElementById('noRes').style.display = 'none';
}

function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m;
  el.className = 'toast show';
  setTimeout(() => el.className = 'toast', 2000);
}

async function s() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;

  const grid = document.getElementById('grid');
  const noRes = document.getElementById('noRes');
  const loadEl = document.getElementById('loadEl');

  grid.innerHTML = '';
  noRes.style.display = 'none';
  loadEl.style.display = 'flex';

  try {
    const r = await fetch('/search?q=' + encodeURIComponent(q) + '&type=' + curType);
    const data = await r.json();
    loadEl.style.display = 'none';

    if (!data.length) {
      noRes.style.display = 'flex';
      return;
    }

    // Enrich with TMDB
    const enriched = await Promise.all(data.map(async (item) => {
      try {
        const t = await fetch('/tmdb?q=' + encodeURIComponent(item.title));
        item.tmdb = t.ok ? await t.json() : null;
      } catch (e) { item.tmdb = null; }
      return item;
    }));

    grid.innerHTML = '';
    enriched.forEach((item) => {
      const card = document.createElement('div');
      card.className = 'card';

      const src = item.source || 'BollyFlix';
      const bs = src === 'BollyFlix' ? 'bf' : 'af';
      const poster = (item.tmdb && item.tmdb.poster) || item.img || '';
      const yr = (item.tmdb && item.tmdb.year) ? `<span class="yr">· ${item.tmdb.year}</span>` : '';
      const rtg = (item.tmdb && item.tmdb.rating)
        ? `<div class="card-rating"><span class="star">★</span> ${item.tmdb.rating.toFixed(1)}</div>`
        : '';
      const qb = (item.quality && item.quality !== 'N/A')
        ? `<span class="card-quality">${item.quality}</span>`
        : '';

      let pi;
      if (poster) {
        pi = `<img src="${poster}" loading="lazy" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=\"font-size:2rem;opacity:.12\">🎬</span>'">`;
      } else {
        pi = `<span style="font-size:2rem;opacity:.12;display:flex;align-items:center;justify-content:center;height:100%">🎬</span>`;
      }

      card.innerHTML = `
        <div class="card-poster">
          ${pi}
          <div class="card-badge ${bs}">${src}</div>
          ${qb}
          ${rtg}
        </div>
        <div class="card-info">
          <div class="card-title">${e(item.title)}</div>
          <div class="card-meta">
            <span class="src">${src}</span>
            ${yr}
          </div>
        </div>
      `;

      card.addEventListener('click', () => openModal(item));
      grid.appendChild(card);
    });
  } catch (e) {
    loadEl.style.display = 'none';
    toast('Vault error — try again');
  }
}

async function openModal(item) {
  try {
    const r = await fetch('/details?source=' + encodeURIComponent(item.source || 'BollyFlix') + '&url=' + encodeURIComponent(item.href));
    const d = await r.json();

    document.getElementById('mT').textContent = d.title || item.title;

    // Meta
    let meta = '';
    if (item.source) meta += item.source;
    if (item.tmdb && item.tmdb.year) meta += ' · ' + item.tmdb.year;
    document.getElementById('mMeta').textContent = meta || '';

    // Overview
    document.getElementById('mOverview').textContent = d.overview || '';

    // Tags
    const tags = document.getElementById('mTags');
    tags.innerHTML = '';
    if (item.source) {
      tags.innerHTML += `<span class="m-tag">${item.source}</span>`;
    }
    if (item.tmdb && item.tmdb.genres) {
      item.tmdb.genres.slice(0, 4).forEach(g => {
        tags.innerHTML += `<span class="m-tag">${g.name}</span>`;
      });
    }
    if (item.quality && item.quality !== 'N/A') {
      tags.innerHTML += `<span class="m-tag">${item.quality}</span>`;
    }

    // Download links
    const ls = document.getElementById('mLs');
    ls.innerHTML = '';
    (d.downloads || []).forEach(x => {
      const li = document.createElement('li');
      li.className = 'm-dl';
      const name = (x.name || 'Download').replace(/\[BollyFlix\]/gi, '').replace(/\[AnimeFlix\]/gi, '').replace(/\s+/g, ' ').trim();
      li.innerHTML = `<span class="m-dl-name">${e(name)}</span><span class="m-dl-quality">${x.quality || ''}</span>`;
      li.addEventListener('click', () => {
        navigator.clipboard.writeText(x.url).then(() => toast('Copied!')).catch(() => {});
      });
      ls.appendChild(li);
    });

    document.getElementById('modal').classList.add('open');
    document.body.style.overflow = 'hidden';
  } catch (e) {
    toast('Error opening vault');
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Stars
(function() {
  const c = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDuration = Math.random() * 4 + 2 + 's';
    s.style.animationDelay = Math.random() * 6 + 's';
    s.style.opacity = Math.random() * 0.5 + 0.15;
    c.appendChild(s);
  }
})();

document.getElementById('q').focus();
</script></body></html>
