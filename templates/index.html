<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoonVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Syne+Mono&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --ink:#05050a;
  --paper:#0a0a12;
  --lift:#12121e;
  --raise:#1a1a2a;
  --rim:rgba(255,255,255,0.07);
  --fire:#ff3c1f;
  --ember:#ff6a00;
  --gold:#ffd166;
  --ice:#c8d8ff;
  --text:#eeeef5;
  --dim:#5a5a72;
  --r:18px;
}

html{scroll-behavior:smooth}

body{
  font-family:'Inter',sans-serif;
  background:var(--ink);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  cursor:default;
}

/* ─── SCANLINE OVERLAY ─── */
body::after{
  content:'';
  position:fixed;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);
  pointer-events:none;z-index:9999;
}

/* ─── AMBIENT LIGHT ─── */
.ambient{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.amb-a{
  position:absolute;
  width:900px;height:900px;
  background:radial-gradient(circle,rgba(255,60,31,0.07) 0%,transparent 65%);
  top:-300px;left:-300px;
  animation:driftA 18s ease-in-out infinite;
}
.amb-b{
  position:absolute;
  width:700px;height:700px;
  background:radial-gradient(circle,rgba(255,106,0,0.05) 0%,transparent 65%);
  bottom:-200px;right:-100px;
  animation:driftB 22s ease-in-out infinite;
}
.amb-c{
  position:absolute;
  width:500px;height:500px;
  background:radial-gradient(circle,rgba(200,216,255,0.04) 0%,transparent 65%);
  top:50%;left:50%;transform:translate(-50%,-50%);
  animation:driftC 30s ease-in-out infinite;
}
@keyframes driftA{0%,100%{transform:translate(0,0)}40%{transform:translate(120px,80px)}70%{transform:translate(-60px,120px)}}
@keyframes driftB{0%,100%{transform:translate(0,0)}50%{transform:translate(-100px,-80px)}}
@keyframes driftC{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.4)}}

/* ─── FILM STRIP TOP ─── */
.filmstrip{
  position:fixed;top:0;left:0;right:0;height:6px;z-index:100;
  background:repeating-linear-gradient(90deg,var(--fire) 0,var(--fire) 18px,transparent 18px,transparent 26px);
  animation:stripScroll 4s linear infinite;
}
@keyframes stripScroll{from{background-position:0 0}to{background-position:44px 0}}

/* ─── HEADER ─── */
header{
  position:sticky;top:6px;z-index:50;
  display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem 3rem;
  background:rgba(5,5,10,0.75);
  backdrop-filter:blur(24px);
  border-bottom:1px solid var(--rim);
}

.wordmark{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:1.5rem;
  letter-spacing:-0.5px;
  display:flex;align-items:center;gap:0.5rem;
}
.wordmark-icon{
  width:34px;height:34px;
  background:linear-gradient(135deg,var(--fire),var(--ember));
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;
  box-shadow:0 0 24px rgba(255,60,31,0.5);
  animation:iconGlow 3s ease-in-out infinite;
}
@keyframes iconGlow{
  0%,100%{box-shadow:0 0 24px rgba(255,60,31,0.5)}
  50%{box-shadow:0 0 40px rgba(255,60,31,0.8),0 0 80px rgba(255,60,31,0.2)}
}
.wordmark span:last-child{
  background:linear-gradient(100deg,#fff 40%,var(--ember));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

.header-tag{
  font-family:'Syne Mono',monospace;
  font-size:0.65rem;
  color:var(--dim);
  letter-spacing:2px;
  text-transform:uppercase;
  border:1px solid var(--rim);
  padding:0.3rem 0.8rem;
  border-radius:99px;
}

/* ─── HERO ─── */
.hero{
  position:relative;z-index:1;
  padding:7rem 3rem 4rem;
  text-align:center;
  overflow:hidden;
}

.hero-label{
  font-family:'Syne Mono',monospace;
  font-size:0.65rem;
  letter-spacing:4px;
  color:var(--fire);
  text-transform:uppercase;
  margin-bottom:1.5rem;
  opacity:0;
  animation:revealUp 0.8s 0.1s cubic-bezier(.16,1,.3,1) forwards;
}

.hero-title{
  font-family:'Syne',sans-serif;
  font-weight:800;
  font-size:clamp(3.5rem,9vw,7.5rem);
  line-height:0.95;
  letter-spacing:-3px;
  margin-bottom:1.5rem;
  opacity:0;
  animation:revealUp 0.9s 0.2s cubic-bezier(.16,1,.3,1) forwards;
}
.hero-title .line2{
  display:block;
  background:linear-gradient(100deg,var(--fire) 0%,var(--ember) 40%,var(--gold) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 40px rgba(255,60,31,0.4));
}

.hero-sub{
  color:var(--dim);
  font-size:1rem;
  font-weight:300;
  letter-spacing:0.3px;
  opacity:0;
  animation:revealUp 0.8s 0.35s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes revealUp{
  from{opacity:0;transform:translateY(40px)}
  to{opacity:1;transform:translateY(0)}
}

/* ─── SEARCH ─── */
.search-zone{
  position:relative;z-index:1;
  max-width:680px;margin:3rem auto 0;
  padding:0 1.5rem;
  opacity:0;
  animation:revealUp 0.8s 0.5s cubic-bezier(.16,1,.3,1) forwards;
}

.search-shell{
  position:relative;
  background:var(--lift);
  border:1px solid var(--rim);
  border-radius:20px;
  display:flex;align-items:center;
  transition:border-color 0.3s,box-shadow 0.3s;
  overflow:hidden;
}
.search-shell::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,60,31,0.04),transparent);
  opacity:0;transition:opacity 0.3s;border-radius:20px;
}
.search-shell:focus-within{
  border-color:rgba(255,60,31,0.5);
  box-shadow:0 0 0 3px rgba(255,60,31,0.1),0 20px 60px rgba(0,0,0,0.5);
}
.search-shell:focus-within::before{opacity:1}

.s-ico{
  padding:0 1.2rem;
  font-size:1rem;color:var(--dim);
  flex-shrink:0;transition:color 0.3s;
}
.search-shell:focus-within .s-ico{color:var(--fire)}

#q{
  flex:1;
  padding:1.1rem 0.5rem;
  background:transparent;border:none;
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:0.95rem;
  font-weight:400;
}
#q::placeholder{color:var(--dim)}
#q:focus{outline:none}

.search-btn{
  margin:0.4rem;
  padding:0.75rem 1.8rem;
  background:linear-gradient(135deg,var(--fire),var(--ember));
  border:none;border-radius:14px;
  color:#fff;
  font-family:'Syne',sans-serif;
  font-weight:700;font-size:0.85rem;
  letter-spacing:0.5px;
  cursor:pointer;
  transition:transform 0.15s,box-shadow 0.3s,opacity 0.2s;
  position:relative;overflow:hidden;
}
.search-btn::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.15),transparent);
  opacity:0;transition:opacity 0.2s;
}
.search-btn:hover{transform:scale(1.04);box-shadow:0 8px 30px rgba(255,60,31,0.5)}
.search-btn:hover::after{opacity:1}
.search-btn:active{transform:scale(0.97)}
.search-btn:disabled{opacity:0.35;cursor:not-allowed;transform:none}

/* ─── MAIN ─── */
main{
  position:relative;z-index:1;
  max-width:1260px;margin:0 auto;
  padding:2.5rem 2.5rem 5rem;
}

/* ─── LOADING ─── */
.loading{display:none;text-align:center;padding:5rem 0}
.film-loader{
  display:inline-flex;gap:5px;margin-bottom:1.2rem;
}
.film-loader span{
  width:6px;height:36px;
  background:var(--fire);
  border-radius:3px;
  animation:filmLoad 1s ease-in-out infinite;
}
.film-loader span:nth-child(2){animation-delay:0.1s;background:var(--ember)}
.film-loader span:nth-child(3){animation-delay:0.2s}
.film-loader span:nth-child(4){animation-delay:0.3s;background:var(--gold)}
.film-loader span:nth-child(5){animation-delay:0.4s;background:var(--ember)}
.film-loader span:nth-child(6){animation-delay:0.5s}
@keyframes filmLoad{
  0%,100%{transform:scaleY(0.4);opacity:0.3}
  50%{transform:scaleY(1.8);opacity:1}
}
.loading p{color:var(--dim);font-family:'Syne Mono',monospace;font-size:0.75rem;letter-spacing:3px;text-transform:uppercase}

/* ─── RESULTS HEADER ─── */
.results-bar{
  display:none;
  align-items:center;justify-content:space-between;
  margin-bottom:1.8rem;
  padding-bottom:1rem;
  border-bottom:1px solid var(--rim);
}
.results-bar .rcount{
  font-family:'Syne',sans-serif;font-size:0.8rem;
  color:var(--dim);letter-spacing:1px;text-transform:uppercase;
}
.results-bar .rcount strong{color:var(--ember)}
.results-bar .rtag{
  font-family:'Syne Mono',monospace;
  font-size:0.65rem;color:var(--dim);
  letter-spacing:2px;text-transform:uppercase;
}

/* ─── GRID ─── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(188px,1fr));
  gap:1.4rem;
}

/* ─── CARD ─── */
.card{
  background:var(--lift);
  border:1px solid var(--rim);
  border-radius:var(--r);
  overflow:hidden;
  cursor:pointer;
  position:relative;
  transition:transform 0.3s cubic-bezier(.16,1,.3,1),box-shadow 0.3s,border-color 0.3s;
  animation:cardReveal 0.6s cubic-bezier(.16,1,.3,1) backwards;
}
.card:hover{
  transform:translateY(-8px) scale(1.02);
  box-shadow:0 30px 70px rgba(0,0,0,0.6),0 0 0 1px rgba(255,60,31,0.25);
  border-color:rgba(255,60,31,0.25);
}
@keyframes cardReveal{
  from{opacity:0;transform:translateY(40px) scale(0.94)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

.poster{
  height:260px;
  background:var(--raise);
  position:relative;overflow:hidden;
}
.poster img{
  width:100%;height:100%;object-fit:cover;
  transition:transform 0.5s cubic-bezier(.16,1,.3,1);
  display:block;
}
.card:hover .poster img{transform:scale(1.1)}

.poster-empty{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0.5rem;
  font-size:2.8rem;
  background:linear-gradient(145deg,var(--raise),#1e1e30);
}
.poster-empty small{font-size:0.65rem;color:var(--dim);font-family:'Syne Mono',monospace;letter-spacing:1px}

/* Card gradient overlay */
.poster::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to top,rgba(5,5,10,0.95) 0%,rgba(5,5,10,0.2) 50%,transparent 100%);
  opacity:0;transition:opacity 0.3s;
}
.card:hover .poster::after{opacity:1}

/* Play button */
.play{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(0.6);
  width:50px;height:50px;
  background:rgba(255,60,31,0.9);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;
  opacity:0;
  transition:all 0.3s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 30px rgba(255,60,31,0.6);
  z-index:2;
}
.card:hover .play{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Quality badge */
.qbadge{
  position:absolute;top:10px;right:10px;
  font-family:'Syne Mono',monospace;
  font-size:0.55rem;font-weight:700;
  letter-spacing:1px;
  padding:0.2rem 0.5rem;
  border-radius:6px;
  background:rgba(255,209,102,0.15);
  border:1px solid rgba(255,209,102,0.35);
  color:var(--gold);
  backdrop-filter:blur(10px);
  z-index:2;
}

/* Source badge */
.srcbadge{
  position:absolute;top:10px;left:10px;
  font-family:'Syne Mono',monospace;
  font-size:0.55rem;font-weight:700;
  letter-spacing:1px;
  padding:0.2rem 0.5rem;
  border-radius:6px;
  background:rgba(255,60,31,0.2);
  border:1px solid rgba(255,60,31,0.4);
  color:var(--fire);
  backdrop-filter:blur(10px);
  z-index:2;
}

.card-body{padding:0.9rem 1rem 1rem}
.card-title{
  font-family:'Syne',sans-serif;
  font-weight:700;font-size:0.82rem;
  line-height:1.3;
  display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:0.3rem;
}
.card-meta{
  font-size:0.68rem;color:var(--dim);
  font-family:'Syne Mono',monospace;
  letter-spacing:0.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* ─── EMPTY STATE ─── */
.empty{
  text-align:center;padding:5rem 0;color:var(--dim);
}
.empty .ei{font-size:3.5rem;margin-bottom:1rem;opacity:0.3;display:block}
.empty p{font-family:'Syne Mono',monospace;font-size:0.75rem;letter-spacing:2px;text-transform:uppercase}

/* ─── MODAL OVERLAY ─── */
.modal{
  display:none;
  position:fixed;inset:0;
  z-index:200;
  align-items:flex-end;justify-content:center;
  padding:0;
}
@media(min-width:640px){
  .modal{align-items:center;padding:1.5rem}
}
.modal.open{
  display:flex;
  animation:bgFadeIn 0.35s forwards;
}
@keyframes bgFadeIn{from{background:rgba(0,0,0,0)}to{background:rgba(0,0,0,0.88)}}

/* ─── MODAL PANEL ─── */
.mpanel{
  background:var(--paper);
  border:1px solid rgba(255,255,255,0.08);
  border-radius:24px 24px 0 0;
  width:100%;max-width:640px;
  max-height:92vh;
  overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--raise) transparent;
  animation:panelUp 0.4s cubic-bezier(.16,1,.3,1) forwards;
  position:relative;
}
@media(min-width:640px){
  .mpanel{border-radius:24px;animation:panelIn 0.4s cubic-bezier(.16,1,.3,1) forwards}
}
@keyframes panelUp{from{transform:translateY(120px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes panelIn{from{transform:scale(0.88) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}

/* Modal top accent bar */
.mpanel::before{
  content:'';display:block;
  height:3px;
  background:linear-gradient(90deg,var(--fire),var(--ember),var(--gold));
  border-radius:24px 24px 0 0;
  flex-shrink:0;
}

.mhandle{
  width:36px;height:4px;
  background:var(--rim);border-radius:2px;
  margin:1rem auto 0;
}
@media(min-width:640px){.mhandle{display:none}}

.mbody{padding:1.5rem 1.8rem 2rem}

/* Poster + info side by side */
.mhero{
  display:flex;gap:1.2rem;margin-bottom:1.2rem;
}
.mthumb{
  width:100px;height:145px;
  flex-shrink:0;
  border-radius:12px;
  overflow:hidden;
  background:var(--raise);
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}
.mthumb img{width:100%;height:100%;object-fit:cover}
.mthumb-empty{
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;
  background:linear-gradient(145deg,var(--raise),#1e1e30);
}

.minfo{flex:1}
.msrc{
  display:inline-block;
  font-family:'Syne Mono',monospace;
  font-size:0.6rem;letter-spacing:1.5px;text-transform:uppercase;
  padding:0.2rem 0.6rem;border-radius:6px;margin-bottom:0.6rem;
  background:rgba(255,60,31,0.15);
  border:1px solid rgba(255,60,31,0.3);
  color:var(--fire);
}
.mtitle{
  font-family:'Syne',sans-serif;
  font-weight:800;font-size:1.5rem;
  line-height:1.05;letter-spacing:-0.5px;
  margin-bottom:0.25rem;
}
.myear{font-size:0.8rem;color:var(--dim);margin-bottom:0.6rem}

.rating-row{display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem}
.stars{
  font-family:'Syne',sans-serif;font-weight:700;font-size:0.85rem;
  padding:0.2rem 0.6rem;border-radius:8px;
  background:rgba(255,209,102,0.1);
  border:1px solid rgba(255,209,102,0.25);
  color:var(--gold);
}
.gpill{
  font-size:0.65rem;padding:0.2rem 0.6rem;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--rim);
  border-radius:6px;color:#aaa;
}

.tmdb-btn{
  display:inline-flex;align-items:center;gap:0.3rem;
  font-size:0.7rem;color:var(--gold);text-decoration:none;
  background:rgba(255,209,102,0.07);
  border:1px solid rgba(255,209,102,0.18);
  padding:0.2rem 0.6rem;border-radius:6px;
  transition:background 0.2s;
  font-family:'Syne Mono',monospace;letter-spacing:0.5px;
}
.tmdb-btn:hover{background:rgba(255,209,102,0.15)}

/* Overview */
.moverview{
  color:var(--dim);font-size:0.82rem;line-height:1.7;
  margin:0.8rem 0;
  padding:0.8rem 1rem;
  background:rgba(255,255,255,0.02);
  border-left:2px solid var(--fire);
  border-radius:0 10px 10px 0;
}

/* Cast */
.mcast{
  font-size:0.75rem;color:#777;
  margin-bottom:1rem;
  padding:0.5rem 0;
  border-bottom:1px solid var(--rim);
  font-family:'Syne Mono',monospace;letter-spacing:0.3px;
}

/* Section header */
.sec-hdr{
  display:flex;align-items:center;gap:0.6rem;
  margin:1.2rem 0 0.8rem;
}
.sec-hdr .sec-line{flex:1;height:1px;background:var(--rim)}
.sec-hdr span{
  font-family:'Syne',sans-serif;font-weight:700;
  font-size:0.65rem;letter-spacing:2.5px;text-transform:uppercase;
  color:var(--dim);
}

/* Download items */
.dls-list{display:flex;flex-direction:column;gap:0.5rem}

.dl-row{
  display:flex;align-items:center;gap:0.7rem;
  padding:0.75rem 0.9rem;
  background:var(--lift);
  border:1px solid var(--rim);
  border-radius:12px;
  transition:border-color 0.2s,background 0.2s,transform 0.15s;
  cursor:pointer;
}
.dl-row:hover{
  border-color:rgba(255,60,31,0.3);
  background:rgba(255,60,31,0.05);
  transform:translateX(3px);
}
.dl-row a{
  flex:1;
  color:var(--text);text-decoration:none;
  font-size:0.8rem;line-height:1.4;
  display:block;word-break:break-word;
}
.dl-icon{
  width:30px;height:30px;flex-shrink:0;
  background:rgba(255,60,31,0.12);
  border:1px solid rgba(255,60,31,0.2);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:0.75rem;
  transition:background 0.2s,transform 0.2s;
}
.dl-row:hover .dl-icon{background:rgba(255,60,31,0.25);transform:scale(1.1)}

.dl-qual{
  font-family:'Syne Mono',monospace;
  font-size:0.62rem;letter-spacing:0.5px;
  padding:0.18rem 0.5rem;
  border-radius:6px;
  background:rgba(255,255,255,0.04);
  border:1px solid var(--rim);
  color:#888;white-space:nowrap;flex-shrink:0;
}

/* Close */
.mclose{
  width:100%;margin-top:1.5rem;
  padding:0.85rem;
  background:var(--lift);
  border:1px solid var(--rim);
  border-radius:14px;
  color:var(--dim);
  font-family:'Syne',sans-serif;font-weight:600;font-size:0.85rem;letter-spacing:1px;
  cursor:pointer;text-transform:uppercase;
  transition:all 0.2s;
}
.mclose:hover{background:rgba(255,60,31,0.08);border-color:rgba(255,60,31,0.25);color:var(--text)}

/* Loading state in modal */
.dl-loading{
  text-align:center;padding:2rem 0;
  font-family:'Syne Mono',monospace;
  font-size:0.7rem;letter-spacing:2px;text-transform:uppercase;
  color:var(--dim);
}
.dl-loading::before{
  content:'';display:block;
  width:24px;height:24px;
  border:2px solid var(--rim);
  border-top-color:var(--fire);
  border-radius:50%;
  margin:0 auto 0.8rem;
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─── MOBILE ─── */
@media(max-width:640px){
  header{padding:0.9rem 1.2rem}
  .hero{padding:4rem 1.2rem 2.5rem}
