<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MovieEngine</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f172a;
  --surf:  #0b1629;
  --surf2: #0f1d33;
  --btn-bg: #1e293b;
  --btn-h:  #334155;
  --txt:   #ffffff;
  --link:  #60a5fa;
  --link-h: #93c5fd;
  --border: #1e293b;
  --ring:  #7c3aed;
  --r: 8px;
  --rb: 6px;
}

html, body {
  height: 100%; min-height: 100svh;
  font-family: 'Inter', Roboto, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--txt);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ─── ANIMATED BG (subtle BollyFlix tone) ─── */
.bg {
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(ellipse at 20% 80%, rgba(59,130,246,.18) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 20%, rgba(124,58,237,.14) 0%, transparent 60%),
    var(--bg);
  animation: bgDrift 18s ease-in-out infinite alternate;
}
@keyframes bgDrift {
  0%   { filter: brightness(1) hue-rotate(0deg); }
  100% { filter: brightness(1.06) hue-rotate(-15deg); }
}

/* ─── LAYOUT ─── */
.shell {
  display: flex; flex-direction: column;
  height: 100vh; height: 100dvh;
  overflow: hidden;
}

/* ─── HEADER ─── */
header {
  display: flex; align-items: center; gap: .8rem;
  padding: 14px 20pxpx;
  border-bottom: 1px solid var(--border);
  background: rgba(15,23,42,.7);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
}
.badge-bf {
  display: inline-flex; align-items: center; padding: 4px 12px;
  border-radius: var(--rb);
  background: #3b82f6;
  color: #fff; font-size: .78rem; font-weight: 900;
  letter-spacing: .4px;
}
h1 { font-size: .9rem; font-weight: 700; color: var(--txt); line-height: 1.3; }

/* ─── SEARCH ─── */
.tabs-search {
  padding: 20pxpx 20pxpx 0;
  flex-shrink: 0;
}
.tabs { display: flex; gap: .5rem; margin-bottom: 10px; }
.tab {
  padding: 5px 14px; border-radius: var(--rb); font-size: .78rem; font-weight: 700;
  background: transparent; border: 1px solid var(--btn-bg); color: #64748b;
  cursor: pointer; transition: all .18s;
}
.tab.active { background: var(--ring); border-color: var(--ring); color: #fff; }
.tab:hover:not(.active) { border-color: #3d6ad6; color: #93c5fd; }

.srch { position: relative; }
.sicon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: #475569; font-size: .88rem; pointer-events: none;
}
.sinput {
  width: 100%; padding: 10px 72px 10px 32px;
  background: rgba(255,255,255,.03);
  border: 1px solid var(--border); border-radius: var(--r);
  color: var(--txt); font-size: .88rem; font-family: inherit; outline: none;
  transition: border-color .18s, background .18s;
}
.sinput::placeholder { color: #3a4a63; }
.sinput:focus { border-color: #2d5aa0; background: rgba(255,255,255,.06); }
.sbtn {
  position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
  padding: 5px 15px; border: none; border-radius: var(--rb);
  background: var(--ring); color: #fff; font-size: .76rem; font-weight: 800;
  cursor: pointer; transition: opacity .18s;
}
.sbtn:hover { opacity: .85; }

/* ─── SCROLL AREA ─── */
.scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: #64748b #e2e8f0;
}
/* WebKit scrollbar */
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 99px; }
.scroll::-webkit-scrollbar-thumb { background: #64748b; border-radius: 99px; }
.scroll::-webkit-scrollbar-thumb:hover { background: #475569; }

/* ─── CONTENT ─── */
#content { display: flex; flex-direction: column; }

.loading, .empty {
  text-align: center; padding: 3rem 1rem;
  color: #475569; font-size: .82rem;
}

/* ─── ROWS ─── */
.row {
  display: flex; align-items: center; justify-content: space-between;
  gap: .8rem; padding: 9px 20pxpx;
  border-bottom: 1px solid var(--border);
  cursor: default;
  transition: background .12s;
  animation: rowIn .22s ease both;
}
@keyframes rowIn { from { opacity:0; transform:translateY(3px); } to { opacity:1; transform:none; } }
.row:nth-child(1) { animation-delay: .01s; }
.row:nth-child(2) { animation-delay: .03s; }
.row:nth-child(3) { animation-delay: .05s; }
.row:nth-child(4) { animation-delay: .07s; }
.row:nth-child(5) { animation-delay: .09s; }
.row:nth-child(6) { animation-delay: .11s; }
.row.platinum { background: linear-gradient(90deg, rgba(124,58,237,.07), transparent); }

.row-l {
  flex: 1; min-width: 0; color: var(--link); font-size: .82rem;
  font-weight: 500; line-height: 1.4;
  display: flex; align-items: center; gap: .4rem;
  word-break: break-all;
}
.rocket { opacity: .7; flex-shrink: 0; font-size: .9rem; }
.sep { color: #2a3f5f; margin: 0 .3rem; }
.row-r { flex-shrink: 0; }

.btn-q {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 82px; padding: 4px 11px;
  border-radius: var(--rb);
  background: var(--btn-bg); border: 1px solid #252e40;
  font-size: .72rem; font-weight: 800; color: var(--txt);
  white-space: nowrap; letter-spacing: .2px;
  transition: background .15s;
}
.btn-q:hover  { background: var(--btn-h); }
.btn-q.gold  { border-color: #7c3aed; background: rgba(124,58,237,.2); }
.btn-q.sd   { min-width: 52px; font-size: .65rem; opacity: .8; }

/* ─── MODAL ─── */
.modal {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.88); backdrop-filter: blur(6px);
  z-index: 200; align-items: center; justify-content: center; padding: 1rem;
}
.modal.open { display: flex; }

.modal-card {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 14px; max-width: 640px; width: 100%; max-height: 85vh;
  overflow-y: auto; padding: 1.4rem;
  box-shadow: 0 30px 90px rgba(0,0,0,.6);
  animation: modalIn .32s cubic-bezier(.34,1.56,.64,1);
}
@keyframes modalIn { from { transform: translateY(24px) scale(.97); opacity:0; } to { transform:none; opacity:1; } }

.m-title { font-size: 1.05rem; font-weight: 800; margin-bottom: .4rem; line-height:1.3; }
.m-meta  { font-size: .78rem; color: #64748b; margin-bottom: .8rem; }
.m-rows  { list-style:none; }
.m-item  {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--rb);
  margin-bottom: 5px; background: var(--surf);
  transition: background .15s;
}
.m-item:hover { background: var(--surf2); }
.m-link  { flex:1; color: var(--link); font-size:.78rem; font-weight:600;
           text-decoration:none; word-break:break-all;
           transition: color .15s; }
.m-link:hover { color: var(--link-h); }
.m-close { width:100%; padding:9px; margin-top:10px; background:var(--surf2); border:1px solid var(--border);
           border-radius:var(--rb); color:var(--txt); font-weight:700; cursor:pointer; }
.m-close:hover { background: var(--btn-bg); }

@media (max-width:480px) {
  html { font-size:14px; }
  .btn-q { min-width:68px; padding:3px 8px; font-size:.68rem; }
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="shell">
  <header>
    <span class="badge-bf">BollyFlix</span>
    <h1 id="title">Loading…</h1>
  </header>

  <div class="tabs-search">
    <div class="tabs">
      <button class="tab active" onclick="setType('movie',this)">🎬 Movies</button>
      <button class="tab" onclick="setType('anime',this)">🎌 Anime</button>
    </div>
    <div class="srch">
      <span class="sicon">🔍</span>
      <input class="sinput" id="q" placeholder="Search movies &amp; anime…" />
      <button class="sbtn" onclick="doSearch()">Search</button>
    </div>
  </div>

  <div class="scroll" id="scroll">
    <div id="content"></div>
    <div class="empty" id="empty"></div>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="m-title" id="m-title"></div>
    <div class="m-meta"  id="m-meta"></div>
    <ul class="m-rows"   id="m-rows"></ul>
    <button class="m-close" onclick="closeModal()">Close ✕</button>
  </div>
</div>

<script>
let curType = 'movie';

function setType(t, el) {
  curType = t;
  el.classList.add('active');
  document.querySelectorAll('.tab').forEach(x => { if(x !== el) x.classList.remove('active'); });
  document.getElementById('content').innerHTML = '';
  document.getElementById('empty').innerHTML = '';
}

async function doSearch() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  document.getElementById('content').innerHTML = '<div class="loading">Searching servers…</div>';
  document.getElementById('empty').innerHTML = '';
  try {
    const r = await fetch('/search?q=' + encodeURIComponent(q) + '&type=' + curType);
    const data = await r.json();
    const scrollEl = document.getElementById('scroll');
    scrollEl.scrollTop = 0;
    if (!data.length) {
      document.getElementById('content').innerHTML = '';
      document.getElementById('empty').innerHTML = '<div class="empty">No results found.</div>';
      return;
    }
    const el = document.getElementById('content');
    el.innerHTML = '';
    data.forEach((item, i) => {
      const isPlatinum = (i + 1) % 5 === 0;
      const badge = item.source === 'BollyFlix' ? '🎬' : '🎌';
      const qBadge = item.quality !== 'N/A'
        ? `<span class="btn-q">${item.quality}</span>`
        : `<span class="btn-q sd">N/A</span>`;
      // Format title nicely
      let title = item.title.replace(/\s*[|｜]\s*BollyFlix$/i, '').trim();
      if (item.meta) title = item.meta;
      const row = document.createElement('div');
      row.className = 'row' + (isPlatinum ? ' platinum' : '');
      row.innerHTML = `
        <span class="row-l">
          <span class="rocket">${badge}</span>
          ${title}
        </span>
        <span class="row-r">${qBadge}</span>
      `;
      row.addEventListener('click', () => openModal(item));
      el.appendChild(row);
    });
    document.getElementById('empty').innerHTML = '';
  } catch(e) {
    document.getElementById('content').innerHTML = '';
    document.getElementById('empty').innerHTML = '<div class="empty">⚠️ Failed. Try again.</div>';
  }
}

async function openModal(item) {
  try {
    const r  = await fetch('/details?source=' + item.source + '&url=' + encodeURIComponent(item.href));
    const d  = await r.json();
    document.getElementById('m-title').textContent = d.title || item.title;
    document.getElementById('m-rows').innerHTML = '';
    if ((d.downloads || []).length) {
      d.downloads.forEach(x => {
        const li = document.createElement('li');
        li.className = 'm-item';
        li.innerHTML =
          '<a class="m-link" href="' + x.url + '" target="_blank" rel="noopener">' + x.name + '</a>' +
          '<span style="display:flex;gap:5px;align-items:center;flex-shrink:0">' +
            (x.quality  !== 'N/A' ? '<span class="btn-q">' + x.quality  + '</span>' : '') +
            (x.size     !== 'N/A' ? '<span class="btn-q sd">'  + x.size     + '</span>' : '') +
          '</span>';
        document.getElementById('m-rows').appendChild(li);
      });
    } else {
      document.getElementById('m-rows').innerHTML = '<div class="empty">No download links found.</div>';
    }
    document.getElementById('modal').classList.add('open');
  } catch(e) { console.error(e); }
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });
document.getElementById('q').focus();
</script>
</body>
</html>
